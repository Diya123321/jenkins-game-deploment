<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Snake</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #1a1a2e 0%, #0f0c1b 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        #score { color: #00f2fe; }
        #high-score { color: #ff0844; }

        #game-board {
            background: #050510;
            display: block;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(79, 172, 254, 0.4);
            border: 3px solid #4facfe;
            margin: 0 auto;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8a8a9e;
        }

        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 27, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
        }

        .overlay h2 {
            font-size: 3rem;
            color: #ff0844;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 8, 68, 0.5);
        }

        .btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.6);
        }

        .relative-wrapper {
            position: relative;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Snake</h1>
        <div class="scoreboard">
            <div class="score-box">Score: <span id="score">0</span></div>
            <div class="score-box">High: <span id="high-score">0</span></div>
        </div>

        <div class="relative-wrapper">
            <div class="overlay" id="game-over-screen">
                <h2>GAME OVER</h2>
                <button class="btn" onclick="resetGame()">Play Again</button>
            </div>

            <canvas id="game-board" width="400" height="400"></canvas>
        </div>

        <p class="instructions">Use Arrow Keys or WASD to move. Press Space to pause.</p>
    </div>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("game-over-screen");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameSpeed = 100; 
        let gameInterval;
        let isPaused = false;
        let changingDirection = false; 

        highScoreElement.textContent = highScore;

        function startGame() {
            clearInterval(gameInterval);
            gameInterval = setInterval(update, gameSpeed);
        }

        function update() {
            if (isPaused) return;

            changingDirection = false;
            clearCanvas();
            moveSnake();
            checkCollision();
            drawFood();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#050510";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const isHead = index === 0;
                
                if (isHead) {
                    ctx.fillStyle = "#00f2fe";
                    // Neon head glow effect
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#00f2fe";
                } else {
                    ctx.fillStyle = `rgba(79, 172, 254, ${1 - (index / snake.length) * 0.6})`;
                    ctx.shadowBlur = 0;
                }

                // Standard fillRect for universal browser compatibility
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0; // Always reset shadows
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
                increaseSpeed();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0844";
            ctx.fillStyle = "#ff0844";
            ctx.beginPath();
            ctx.arc((food.x * gridSize) + (gridSize / 2), (food.y * gridSize) + (gridSize / 2), (gridSize / 2) - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; 
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Double check it doesn't land on the snake
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    generateFood();
                    break;
                }
            }
        }

        function checkCollision() {
            const head = snake[0];

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                }
            }
        }

        function increaseSpeed() {
            if (score % 50 === 0 && gameSpeed > 50) {
                clearInterval(gameInterval);
                gameSpeed -= 8;
                gameInterval = setInterval(update, gameSpeed);
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreElement.textContent = highScore;
            }
            gameOverScreen.style.display = "flex";
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = score;
            gameOverScreen.style.display = "none";
            generateFood();
            startGame();
        }

        window.addEventListener("keydown", e => {
            if (changingDirection) return;

            const keyPressed = e.key.toLowerCase();
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((keyPressed === "arrowup" || keyPressed === "w") && !goingDown) {
                dx = 0; dy = -1; changingDirection = true;
            }
            if ((keyPressed === "arrowdown" || keyPressed === "s") && !goingUp) {
                dx = 0; dy = 1; changingDirection = true;
            }
            if ((keyPressed === "arrowleft" || keyPressed === "a") && !goingRight) {
                dx = -1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === "arrowright" || keyPressed === "d") && !goingLeft) {
                dx = 1; dy = 0; changingDirection = true;
            }
            if (e.key === " ") {
                isPaused = !isPaused;
                e.preventDefault(); 
            }
        });

        // Ensure initialization runs after everything loads
        window.onload = () => {
            generateFood();
            startGame();
        };
    </script>
</body>
</html>
